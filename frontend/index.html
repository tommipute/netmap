<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>NetMap</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap"
      rel="stylesheet"
      crossorigin="anonymous"
    />
  </head>
  <body>
    <!-- Tema, densità e animazioni scelti nelle Preferenze (theme.js, prefs.js): applicati subito, così la pagina non lampeggia col tema sbagliato -->
    <script>
      try {
        var t = localStorage.getItem('netmap.theme')
        if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t
        if (localStorage.getItem('netmap.density') === 'compact') document.documentElement.dataset.density = 'compact'
        var calm = localStorage.getItem('netmap.motion') === 'reduced' || matchMedia('(prefers-reduced-motion: reduce)').matches
        document.documentElement.dataset.motion = calm ? 'reduced' : 'full'
      } catch (e) {}
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
