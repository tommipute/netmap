# Produzione: file compilati di Vite + inoltro dell'API (come il proxy di vite.config.js in sviluppo)
server {
    listen 80;
    root /usr/share/nginx/html;
    client_max_body_size 20m;   # import di device da CSV/Excel

    # DNS di Docker: il nome "api" si risolve a ogni richiesta, così nginx parte anche se l'api si sta riavviando
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api http://api:8000;

    # Backup caricati dall'interfaccia (pagina Backup): possono essere grandi e lenti da mandare
    location = /api/backups/upload {
        client_max_body_size 0;
        proxy_request_buffering off;
        proxy_pass $api;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    location ~ ^/(api/|docs|openapi\.json) {
        proxy_pass $api;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;   # export ed elenchi grandi
    }

    # I file di Vite hanno l'hash nel nome: si possono tenere in cache per sempre
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Applicazione a pagina singola: ogni indirizzo (es. /devices/12) carica index.html, mai tenuto in cache
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
