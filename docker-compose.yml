name: netmap

# Log dei container: al massimo 3 file da 10 MB ciascuno, poi i più vecchi si cancellano (docker compose logs)
x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"

# Rete di laboratorio (backend/app/lab): apparati finti che rispondono a SNMP e ping.
# Partono solo con: docker compose --profile lab up -d   (poi: docker compose exec api python -m app.lab prepara)
# Per simulare un guasto basta fermarne uno: docker compose stop lab-sw-p3
x-lab-device: &lab-device
  image: netmap-worker      # stessa immagine del worker (ha snmpsim): niente build in più
  pull_policy: never
  profiles: ["lab"]
  restart: unless-stopped
  logging: *logging
  volumes:
    - ./backend:/app

services:
  db:
    image: postgres:16
    restart: unless-stopped
    logging: *logging
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      # Solo da questo computer (niente password del DB esposta in rete); 5433 per non scontrarsi con l'inventory
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./backend
    env_file:   # versione installata (commit, data, tag), scritta da updater/updater.sh
      - path: ./version.env
        required: false
    networks: [default, lab]   # lab: per scansionare/pingare gli apparati finti
    restart: unless-stopped
    logging: *logging
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      SECRETS_KEY: ${SECRETS_KEY:-}   # vuota = chiave generata in backend/.secrets_key
      TZ: ${TZ:-Europe/Rome}           # orari dei log delle scansioni
      AUTH_ENABLED: ${AUTH_ENABLED:-true}
      SESSION_HOURS: ${SESSION_HOURS:-12}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}   # true se l'app è dietro HTTPS
      UVICORN_EXTRA_ARGS: --reload
      WATCHFILES_FORCE_POLLING: ${FILE_POLLING:-true}   # serve su Windows; su Linux FILE_POLLING=false
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8001:8000"   # 8001 per non andare in conflitto con l'app inventory
    volumes:
      - ./backend:/app
      - ./updater-data:/updater-data   # cartella condivisa con l'updater sull'host (vedi updater/)
      - ./backups:/backups             # backup fatti dall'updater: scarica, carica, copie fuori dal server

  # Esegue le scansioni SNMP in coda (stessa immagine dell'API, comando diverso)
  worker:
    build: ./backend
    env_file:   # versione installata (commit, data, tag), scritta da updater/updater.sh
      - path: ./version.env
        required: false
    networks: [default, lab]   # lab: per scansionare/pingare gli apparati finti
    restart: unless-stopped
    logging: *logging
    # watchfiles riavvia il worker quando cambia il codice (come --reload per l'API)
    command: watchfiles --filter python "python -m app.worker" app
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      SECRETS_KEY: ${SECRETS_KEY:-}
      TZ: ${TZ:-Europe/Rome}
      WATCHFILES_FORCE_POLLING: ${FILE_POLLING:-true}
    depends_on:
      db:
        condition: service_healthy
      api:
        condition: service_started   # l'API applica le migration all'avvio
    volumes:
      - ./backend:/app
      - ./backups:/backups   # copie dei backup fuori dal server (services/offsite.py)

  # Stato live: ping e SNMP periodici sui device con IP di management (stessa immagine dell'API)
  monitor:
    build: ./backend
    env_file:   # versione installata (commit, data, tag), scritta da updater/updater.sh
      - path: ./version.env
        required: false
    networks: [default, lab]   # lab: per scansionare/pingare gli apparati finti
    restart: unless-stopped
    logging: *logging
    command: watchfiles --filter python "python -m app.monitor" app
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      SECRETS_KEY: ${SECRETS_KEY:-}
      TZ: ${TZ:-Europe/Rome}
      MONITOR_INTERVAL_SECONDS: ${MONITOR_INTERVAL_SECONDS:-60}   # 0 = monitor spento
      WATCHFILES_FORCE_POLLING: ${FILE_POLLING:-true}
    depends_on:
      db:
        condition: service_healthy
      api:
        condition: service_started
    volumes:
      - ./backend:/app

  web:
    image: node:20-alpine
    env_file:   # cambia a ogni aggiornamento: il container riparte e rifà npm install
      - path: ./version.env
        required: false
    restart: unless-stopped
    logging: *logging
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    environment:
      VITE_API_PROXY: http://api:8000
      CHOKIDAR_USEPOLLING: ${FILE_POLLING:-true}
      VITE_ALLOWED_HOSTS: ${VITE_ALLOWED_HOSTS:-}   # nomi host accettati oltre a IP e localhost
    depends_on:
      - api
    ports:
      - "5174:5173"   # 5174 per non andare in conflitto con un altro progetto Vite
    volumes:
      - ./frontend:/app
      - web_node_modules:/app/node_modules

  lab-fw:
    <<: *lab-device
    command: python -m app.lab agent fw-lab-01
    networks: { lab: { ipv4_address: 172.31.250.10 } }
  lab-core:
    <<: *lab-device
    command: python -m app.lab agent core-lab-01
    networks: { lab: { ipv4_address: 172.31.250.11 } }
  lab-sw-p1:
    <<: *lab-device
    command: python -m app.lab agent sw-lab-p1
    networks: { lab: { ipv4_address: 172.31.250.21 } }
  lab-sw-p2:
    <<: *lab-device
    command: python -m app.lab agent sw-lab-p2
    networks: { lab: { ipv4_address: 172.31.250.22 } }
  lab-sw-p3:
    <<: *lab-device
    command: python -m app.lab agent sw-lab-p3
    networks: { lab: { ipv4_address: 172.31.250.23 } }

networks:
  default: {}
  lab:
    ipam:
      config:
        - subnet: 172.31.250.0/24
          ip_range: 172.31.250.128/25   # indirizzi automatici (api, worker, monitor) lontani dagli apparati

volumes:
  pgdata:
  web_node_modules:
