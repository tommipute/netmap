name: netmap

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      # Solo da questo computer (niente password del DB esposta in rete); 5433 per non scontrarsi con l'inventory
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      SECRETS_KEY: ${SECRETS_KEY:-}   # vuota = chiave generata in backend/.secrets_key
      TZ: ${TZ:-Europe/Rome}           # orari dei log delle scansioni
      UVICORN_EXTRA_ARGS: --reload
      WATCHFILES_FORCE_POLLING: ${FILE_POLLING:-true}   # serve su Windows; su Linux FILE_POLLING=false
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8001:8000"   # 8001 per non andare in conflitto con l'app inventory
    volumes:
      - ./backend:/app

  # Esegue le scansioni SNMP in coda (stessa immagine dell'API, comando diverso)
  worker:
    build: ./backend
    restart: unless-stopped
    # watchfiles riavvia il worker quando cambia il codice (come --reload per l'API)
    command: watchfiles --filter python "python -m app.worker" app
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      SECRETS_KEY: ${SECRETS_KEY:-}
      TZ: ${TZ:-Europe/Rome}
      WATCHFILES_FORCE_POLLING: ${FILE_POLLING:-true}
    depends_on:
      db:
        condition: service_healthy
      api:
        condition: service_started   # l'API applica le migration all'avvio
    volumes:
      - ./backend:/app

  web:
    image: node:20-alpine
    restart: unless-stopped
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    environment:
      VITE_API_PROXY: http://api:8000
      CHOKIDAR_USEPOLLING: ${FILE_POLLING:-true}
      VITE_ALLOWED_HOSTS: ${VITE_ALLOWED_HOSTS:-.netbird.cloud}   # nomi host accettati oltre a IP e localhost
    depends_on:
      - api
    ports:
      - "5174:5173"   # 5174 per non andare in conflitto con un altro progetto Vite
    volumes:
      - ./frontend:/app
      - web_node_modules:/app/node_modules

volumes:
  pgdata:
  web_node_modules:
