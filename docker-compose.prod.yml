# Produzione: si aggiunge a docker-compose.yml mettendo nel file .env
#   COMPOSE_FILE=docker-compose.yml:docker-compose.prod.yml
# Differenze rispetto allo sviluppo: il codice è dentro le immagini (niente cartelle montate né ricarica
# automatica), l'interfaccia è compilata e servita da nginx, niente pytest/simulatore SNMP, l'API diretta
# risponde solo sul server stesso (dalla rete si passa dall'interfaccia: /api e /docs).
# La chiave dei segreti, se non è in SECRETS_KEY, sta in ./data/secrets_key: non cancellarla.

x-backend: &backend
  image: netmap-backend
  build:
    context: ./backend
    args:
      REQUIREMENTS: requirements.txt

services:
  api:
    <<: *backend
    environment:
      UVICORN_EXTRA_ARGS: ""
      SECRETS_KEY_FILE: /data/secrets_key
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-1}   # nginx (con il profilo https anche Caddy: 2)
    ports: !override
      - "127.0.0.1:8001:8000"   # solo per il controllo di salute dell'updater
    volumes: !override
      - ./data:/data
      - ./updater-data:/updater-data
      - ./backups:/backups

  worker:
    <<: *backend
    command: python -m app.worker
    environment:
      SECRETS_KEY_FILE: /data/secrets_key
    volumes: !override
      - ./data:/data
      - ./backups:/backups

  monitor:
    <<: *backend
    command: python -m app.monitor
    environment:
      SECRETS_KEY_FILE: /data/secrets_key
    volumes: !override
      - ./data:/data

  web:
    image: netmap-web
    build: ./frontend
    working_dir: !reset null
    command: !reset null
    environment: !reset {}
    ports: !override
      - "5174:80"
    volumes: !reset []

  # HTTPS (facoltativo): nel .env COMPOSE_PROFILES=https, NETMAP_HOST, NETMAP_TLS e COOKIE_SECURE=true.
  # Stesso Caddyfile delle installazioni con le immagini pronte (deploy/Caddyfile).
  caddy:
    image: caddy:2-alpine
    profiles: ["https"]
    restart: unless-stopped
    logging:   # come gli altri servizi (docker-compose.yml)
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    environment:
      NETMAP_HOST: ${NETMAP_HOST:-localhost}
      NETMAP_SCHEME: ${NETMAP_SCHEME:-https}
      NETMAP_TLS: ${NETMAP_TLS:-tls internal}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./certs:/certs:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web

volumes:
  caddy_data:
  caddy_config:
